# One effect for the whole graph: @putdotio/sdk pins effect exactly, and the @effect/* caret ranges
# alchemy pulls in float past it. Move these with the package.json pins.
overrides:
  effect: 4.1.2
  "@effect/platform-browser": 4.1.2
  "@effect/platform-node": 4.1.2
  "@effect/platform-node-shared": 4.1.2
  "@effect/sql-d1": 4.1.2
peerDependencyRules:
  # capnp-es (via @alchemy.run/cloudflare-runtime) needs typescript only in its compiler entry, which nothing loads.
  allowedVersions:
    capnp-es>typescript: "7"
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false

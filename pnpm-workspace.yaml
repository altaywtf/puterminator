# One effect for the whole graph: @putdotio/sdk pins effect exactly, and the @effect/* caret ranges
# alchemy pulls in float past it. The catalog holds the version; package.json and the overrides read it.
catalog:
  effect: 4.1.2
  "@effect/platform-browser": 4.1.2
  "@effect/platform-node": 4.1.2
  "@effect/platform-node-shared": 4.1.2
  "@effect/sql-d1": 4.1.2
overrides:
  effect: "catalog:"
  "@effect/platform-browser": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/sql-d1": "catalog:"
peerDependencyRules:
  # capnp-es (via @alchemy.run/cloudflare-runtime) needs typescript only in its compiler entry, which nothing loads.
  allowedVersions:
    capnp-es>typescript: "7"
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
minimumReleaseAgeExclude:
  - "@alchemy.run/acme@2.0.0-beta.85"
  - "@alchemy.run/cloudflare-runtime@2.0.0-beta.85"
  - "@alchemy.run/cloudflare@2.0.0-beta.85"
  - "@alchemy.run/docker@2.0.0-beta.85"
  - "@alchemy.run/node-utils@2.0.0-beta.85"
  - "@alchemy.run/sql@2.0.0-beta.85"
  - "@distilled.cloud/acme@1.0.0-rc.18"
  - "@distilled.cloud/aws4signer@1.0.0-rc.18"
  - "@distilled.cloud/aws@1.0.0-rc.18"
  - "@distilled.cloud/cloudflare@1.0.0-rc.18"
  - "@distilled.cloud/core@1.0.0-rc.18"
  - "@distilled.cloud/iceberg@1.0.0-rc.18"
  - alchemy@2.0.0-beta.85
  - "@putdotio/sdk@13.3.2 || 14.0.0 || 15.0.1"

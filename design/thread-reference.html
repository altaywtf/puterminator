<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puterminator — agent prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f5f5; --panel: #ffffff; --raised: #ffffff; --subtle: #f7f7f7; --hover: #f0f0f0;
  --line: rgb(0 0 0 / 0.07); --line-strong: rgb(0 0 0 / 0.12);
  --fg: #171717; --fg-2: #525252; --fg-3: #8a8a8a; --fg-4: #b4b4b4;
  --primary: #171717; --primary-fg: #ffffff;
  --accent: #5e6ad2; --ok: #1f9d55; --warn: #b7791f; --danger: #d14343;
  --ok-soft: rgb(31 157 85 / 0.1); --warn-soft: rgb(183 121 31 / 0.12); --danger-soft: rgb(209 67 67 / 0.1);
  --shadow: 0 0 0 1px rgb(0 0 0 / 0.06), 0 1px 2px rgb(0 0 0 / 0.04), 0 4px 12px -4px rgb(0 0 0 / 0.06);
  --shadow-lg: 0 0 0 1px rgb(0 0 0 / 0.06), 0 2px 4px rgb(0 0 0 / 0.04), 0 12px 32px -8px rgb(0 0 0 / 0.12);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e0e0f; --panel: #151516; --raised: #1c1c1e; --subtle: #19191b; --hover: #222224;
    --line: #26262a; --line-strong: #323236;
    --fg: #ededed; --fg-2: #a1a1a1; --fg-3: #737373; --fg-4: #4a4a4a;
    --primary: #ededed; --primary-fg: #111111;
    --accent: #8b93e8; --ok: #3fb950; --warn: #d29922; --danger: #f06a6a;
    --ok-soft: rgb(63 185 80 / 0.12); --warn-soft: rgb(210 153 34 / 0.14); --danger-soft: rgb(240 106 106 / 0.12);
    --shadow: 0 0 0 1px #26262a; --shadow-lg: 0 0 0 1px #2c2c30, 0 16px 40px -12px rgb(0 0 0 / 0.6);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font: 13px/1.55 var(--font); color: var(--fg); background: var(--bg); letter-spacing: -0.003em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-synthesis: none; font-feature-settings: "cv11", "ss01"; }
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; touch-action: manipulation; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--fg-3); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0; }
.trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* shell: Linear-style gray chrome with inset panel */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); height: 100dvh; }
.side { display: flex; flex-direction: column; gap: 2px; padding: 10px 8px; min-width: 0; }
.ws { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; font-weight: 500; }
.logo { width: 20px; height: 20px; border-radius: 6px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-size: 11px; font-weight: 600; }
.nav { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 6px; color: var(--fg-2); width: 100%; text-align: start;
  transition: background-color 120ms ease-out, color 120ms ease-out; }
.nav[aria-current="page"] { background: var(--hover); color: var(--fg); }
@media (hover: hover) and (pointer: fine) { .nav:hover { background: var(--hover); color: var(--fg); } }
.side-label { padding: 14px 8px 4px; font-size: 12px; color: var(--fg-3); }
.side-foot { margin-top: auto; display: grid; gap: 6px; padding: 8px; }
.meter { height: 4px; border-radius: 99px; background: var(--line-strong); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--fg-2); border-radius: 99px; transform-origin: left; transition: transform 300ms var(--ease); }
.main { margin: 8px; background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; position: relative; }
.mainbar { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); flex: none; }
.mainbar .title { font-weight: 500; }
.ghost-ic { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--fg-3); position: relative; }
.ghost-ic::before { content: ""; position: absolute; inset: -6px; }
@media (hover: hover) and (pointer: fine) { .ghost-ic:hover { background: var(--hover); color: var(--fg); } }
@media (max-width: 760px) { .shell { grid-template-columns: 1fr; } .side { display: none; } .main { margin: 0; border-radius: 0; } }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; font-weight: 500; white-space: nowrap;
  transition: background-color 120ms ease-out, box-shadow 120ms ease-out, transform 120ms ease-out, color 120ms ease-out; }
.btn:active { transform: scale(0.96); }
.btn-primary { background: var(--primary); color: var(--primary-fg); }
.btn-secondary { background: var(--raised); box-shadow: var(--shadow); color: var(--fg); }
.btn-quiet { color: var(--fg-2); padding: 0 8px; }
@media (hover: hover) and (pointer: fine) {
  .btn-primary:hover { background: color-mix(in oklch, var(--primary) 85%, var(--panel)); }
  .btn-secondary:hover { background: var(--hover); }
  .btn-quiet:hover { background: var(--hover); color: var(--fg); }
}
.btn[disabled] { opacity: 1; background: var(--hover); color: var(--fg-4); box-shadow: none; cursor: default; transform: none; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 12px; font-weight: 500; background: var(--hover); color: var(--fg-2); white-space: nowrap; }
.tag-warn { background: var(--warn-soft); color: var(--warn); } .tag-danger { background: var(--danger-soft); color: var(--danger); } .tag-ok { background: var(--ok-soft); color: var(--ok); }

/* thread */
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; scroll-padding-bottom: 180px; }
.thread { max-width: 680px; margin: 0 auto; padding: 28px 20px 200px; display: grid; gap: 18px; }
.u { justify-self: end; max-width: 80%; padding: 8px 12px; border-radius: 12px; background: var(--hover); white-space: pre-wrap; }
.a { display: grid; gap: 10px; min-width: 0; }
.a p { margin: 0; max-width: 62ch; text-wrap: pretty; }
.a strong { font-weight: 600; }
.caret::after { content: ""; display: inline-block; width: 6px; height: 13px; margin-inline-start: 2px; vertical-align: -2px; background: var(--fg-3); border-radius: 1px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.step { display: grid; gap: 4px; }
.step-head { display: flex; align-items: center; gap: 8px; color: var(--fg-3); height: 24px; width: fit-content; max-width: 100%; border-radius: 6px; }
.step-head .name { color: var(--fg-2); }
.step-head .chev { transition: transform 150ms ease-out; }
.step-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
@media (hover: hover) and (pointer: fine) { button.step-head:hover .name { color: var(--fg); } }
.step-body { margin-inline-start: 6px; padding: 2px 0 2px 14px; border-inline-start: 1px solid var(--line-strong); color: var(--fg-3); display: grid; gap: 2px; }
.step-body .mono { color: var(--fg-2); }
.spin { width: 12px; height: 12px; border-radius: 99px; border: 1.5px solid var(--line-strong); border-top-color: var(--fg-2); animation: spin 700ms linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.shimmer { background: linear-gradient(90deg, var(--fg-3) 0%, var(--fg) 50%, var(--fg-3) 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shim 1.4s linear infinite; }
@keyframes shim { from { background-position: 100% 0; } to { background-position: -100% 0; } }

.block { border-radius: 10px; background: var(--raised); box-shadow: var(--shadow); overflow: hidden; }
.enter { animation: rise 260ms var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } }
.block-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.block-head .t { font-weight: 500; }
.block-foot { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-top: 1px solid var(--line); background: var(--subtle); }
.rowx { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
.rowx:first-child { border-top: 0; }
.grow { flex: 1; }

/* score */
.score { display: grid; grid-template-columns: auto 1fr; gap: 20px; padding: 16px; align-items: center; }
.ring { width: 64px; height: 64px; position: relative; }
.ring svg { width: 64px; height: 64px; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
.bars { display: grid; gap: 8px; }
.barrow { display: grid; grid-template-columns: 90px 1fr 28px; gap: 10px; align-items: center; color: var(--fg-2); }
.track { height: 4px; border-radius: 99px; background: var(--hover); overflow: hidden; }
.track > i { display: block; height: 100%; border-radius: 99px; background: var(--fg-2); transform-origin: left; animation: grow 700ms var(--ease) both; }
@keyframes grow { from { transform: scaleX(0); } }

/* question options */
.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 10px; align-items: start; text-align: start; padding: 10px 12px; border-radius: 10px;
  background: var(--raised); box-shadow: var(--shadow); transition: box-shadow 120ms ease-out, background-color 120ms ease-out, transform 120ms ease-out; width: 100%; }
.opt:active { transform: scale(0.99); }
@media (hover: hover) and (pointer: fine) { .opt:hover:not([disabled]) { background: var(--subtle); } }
.opt .radio { width: 16px; height: 16px; border-radius: 99px; box-shadow: inset 0 0 0 1.5px var(--line-strong); margin-top: 1px; }
.opt[aria-checked="true"] { box-shadow: 0 0 0 1.5px var(--fg); }
.opt[aria-checked="true"] .radio { box-shadow: inset 0 0 0 5px var(--fg); }
.opt[disabled]:not([aria-checked="true"]) { opacity: 0.45; cursor: default; }
.opt .ex { margin-top: 4px; color: var(--fg-3); }

/* plan groups */
.grp { border-top: 1px solid var(--line); }
.grp:first-child { border-top: 0; }
.grp-h { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: start; padding: 10px 12px; }
@media (hover: hover) and (pointer: fine) { .grp-h:hover { background: var(--subtle); } }
.grp-h .chev { transition: transform 150ms ease-out; color: var(--fg-3); }
.grp-h[aria-expanded="true"] .chev { transform: rotate(90deg); }
.grp-b { padding: 0 12px 10px 38px; display: grid; gap: 6px; }
.diff { display: grid; gap: 1px; min-width: 0; }
.diff .old { color: var(--fg-3); text-decoration: line-through; text-decoration-color: var(--fg-4); }
.diff .new { color: var(--fg); }
.toggle { width: 28px; height: 16px; border-radius: 99px; background: var(--line-strong); position: relative; transition: background-color 150ms ease-out; flex: none; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 99px; background: #fff; transition: transform 150ms var(--ease); box-shadow: 0 1px 2px rgb(0 0 0 / 0.2); }
.toggle[aria-checked="true"] { background: var(--fg); }
.toggle[aria-checked="true"]::after { transform: translateX(12px); background: var(--panel); }
.toggle-hit { position: relative; display: inline-flex; align-items: center; }
.toggle-hit::before { content: ""; position: absolute; inset: -12px -8px; }

.progress { height: 4px; border-radius: 99px; background: var(--hover); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--fg); transform-origin: left; transition: transform 120ms linear; }
.loglines { font-family: var(--mono); font-size: 11.5px; color: var(--fg-3); display: grid; gap: 1px; height: 76px; overflow: hidden; align-content: end; }

/* composer: floating card, Linear/Cursor style */
.composer-wrap { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 20px 16px; pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--panel) 40%); }
.composer { pointer-events: auto; max-width: 680px; margin: 0 auto; border-radius: 12px; background: var(--raised); box-shadow: var(--shadow-lg); padding: 10px 10px 8px 14px; display: grid; gap: 6px; }
.composer textarea { border: 0; outline: 0; resize: none; background: transparent; width: 100%; min-height: 22px; max-height: 140px; padding: 2px 0; font-size: 16px; line-height: 1.5; }
@media (min-width: 761px) { .composer textarea { font-size: 13.5px; } }
.composer textarea::placeholder { color: var(--fg-3); }
.composer-row { display: flex; align-items: center; gap: 4px; }
.pick .i.down { transform: rotate(90deg); width: 12px; height: 12px; }
.pick { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; border-radius: 6px; color: var(--fg-2); font-size: 12.5px; }
@media (hover: hover) and (pointer: fine) { .pick:hover { background: var(--hover); color: var(--fg); } }
.send { width: 28px; height: 28px; border-radius: 99px; background: var(--fg); color: var(--panel); display: grid; place-items: center; transition: transform 120ms ease-out, background-color 120ms ease-out; position: relative; }
.send::before { content: ""; position: absolute; inset: -8px; }
.send:active { transform: scale(0.94); }
.send[disabled] { background: var(--line-strong); color: var(--fg-3); cursor: default; }
.send svg.i { width: 14px; height: 14px; stroke-width: 2; }

/* empty state */
.hero { max-width: 680px; margin: 0 auto; padding: 14vh 20px 40px; display: grid; gap: 18px; }
.hero h1 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -0.02em; text-align: center; text-wrap: balance; }
.memory { display: flex; gap: 8px; align-items: center; justify-content: center; color: var(--fg-3); font-size: 12.5px; }
.hero .sub { margin: -10px 0 0; text-align: center; color: var(--fg-3); }
.hero .composer-slot .composer { box-shadow: var(--shadow-lg); }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 900px) { .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.card-s { display: grid; gap: 4px; align-content: start; text-align: start; padding: 12px; border-radius: 10px; background: var(--raised); box-shadow: var(--shadow); min-height: 92px;
  transition: background-color 120ms ease-out, transform 120ms ease-out; }
.card-s:active { transform: scale(0.98); }
@media (hover: hover) and (pointer: fine) { .card-s:hover { background: var(--subtle); } }
.card-s .t { font-weight: 500; margin-top: 6px; } .card-s .d { color: var(--fg-3); font-size: 12.5px; line-height: 1.45; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { height: 28px; padding: 0 10px; border-radius: 8px; box-shadow: var(--shadow); background: var(--raised); color: var(--fg-2); font-size: 12.5px; transition: background-color 120ms ease-out, transform 120ms ease-out; }
.chip:active { transform: scale(0.96); }
@media (hover: hover) and (pointer: fine) { .chip:hover { background: var(--subtle); color: var(--fg); } }

/* split layout */
.split { display: grid; grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); flex: 1; min-height: 0; }
.split > .chatcol { display: flex; flex-direction: column; min-height: 0; border-inline-end: 1px solid var(--line); position: relative; }
.split .thread { padding: 20px 16px 200px; max-width: none; }
.split .composer-wrap { padding: 0 12px 12px; }
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); }
.tabs { display: flex; gap: 2px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.tab { height: 26px; padding: 0 10px; border-radius: 6px; color: var(--fg-3); font-weight: 500; }
.tab[aria-selected="true"] { background: var(--hover); color: var(--fg); }
@media (hover: hover) and (pointer: fine) { .tab:hover { color: var(--fg); } }
.pane-body { flex: 1; overflow: auto; padding: 20px; }
.pane-empty { height: 100%; display: grid; place-content: center; text-align: center; gap: 6px; color: var(--fg-3); }
.pane-empty .logo { margin: 0 auto 6px; width: 28px; height: 28px; border-radius: 8px; opacity: 0.3; }
.lib { display: grid; gap: 2px; }
.lib-row { display: grid; grid-template-columns: minmax(0, 1fr) 80px 90px; gap: 12px; align-items: center; height: 32px; padding: 0 8px; border-radius: 6px; color: var(--fg-2); }
.lib-row.h { color: var(--fg-3); font-size: 12px; height: 24px; }
@media (hover: hover) and (pointer: fine) { .lib-row:not(.h):hover { background: var(--subtle); } }
.pointer { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; box-shadow: var(--shadow); background: var(--raised); color: var(--fg-2); width: fit-content; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } .pane { display: none; } }

/* autopilot */
.run { max-width: 720px; margin: 0 auto; padding: 28px 20px 200px; display: grid; gap: 16px; }
.run-head { display: grid; gap: 4px; }
.run-head h2 { margin: 0; font-size: 16px; font-weight: 500; letter-spacing: -0.01em; }
.checklist { display: grid; }
.ck { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.ck:first-child { border-top: 0; }
.ck-ic { width: 18px; height: 18px; border-radius: 99px; display: grid; place-items: center; margin-top: 0; }
.ck-ic.done { background: var(--ok); color: #fff; }
.ck-ic.done svg.i { width: 11px; height: 11px; stroke-width: 2.4; }
.ck-ic.wait { box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.ck-ic.need { background: var(--warn); color: #fff; font-size: 11px; font-weight: 600; }
.ck-t { font-weight: 500; display: flex; gap: 8px; align-items: center; min-height: 18px; }
.ck-d { color: var(--fg-3); margin-top: 2px; }
.ck-body { margin-top: 10px; display: grid; gap: 8px; }
.ck.active { background: var(--subtle); margin: 0 -12px; padding: 10px 12px; border-radius: 10px; border-top-color: transparent; }
.ck.active + .ck { border-top-color: transparent; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* picker — verbatim from ui:prototype PICKER.md */
.proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
.proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
.proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
@media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
.proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>
<div id="stage"></div>
<nav class="proto-picker" data-position="top" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Thread</button>
  <button class="proto-picker-item">Workspace</button>
  <button class="proto-picker-item">Autopilot</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>
<script>
const DATA = /*DATA*/;
const UNOPENED = /*UNOPENED*/;
// ---------- helpers ----------

function progressHtml(p, A) {

const composerHtml = (placeholder, model = true) => `<form class="composer" data-composer>

const STARTERS = [

// generic wiring for a variant root
function wire(root, A, rerender) {
  root.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.say) A.send(b.dataset.say);
    else if (b.dataset.choose) A.choose(b.dataset.choose);
    else if (b.dataset.exp) { expanded.has(b.dataset.exp) ? expanded.delete(b.dataset.exp) : expanded.add(b.dataset.exp); rerender(); }
    else if (b.dataset.tog) A.toggleGroup(b.dataset.tog);
    else if (b.dataset.open) A.openGroup(b.dataset.open);
    else if (b.dataset.more) A.more(b.dataset.more);
    else if ('stop' in b.dataset) A.stop();
    else if ('undo' in b.dataset) A.undo();
    else if ('new' in b.dataset) mount(current);
  });
  root.addEventListener('submit', e => { e.preventDefault(); const ta = e.target.querySelector('textarea'); const v = ta.value; ta.value = ''; autosize(ta); A.send(v); });
  root.addEventListener('keydown', e => { if (e.target.tagName === 'TEXTAREA' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); e.target.form.requestSubmit(); } });
  root.addEventListener('input', e => { if (e.target.tagName === 'TEXTAREA') autosize(e.target); });
}
const autosize = ta => { ta.style.height = 'auto'; ta.style.height = Math.min(140, ta.scrollHeight) + 'px'; };
function syncChrome(root, A) {
  root.querySelectorAll('[data-credits]').forEach(el => el.textContent = `${A.S.credits} credits`);
  root.querySelectorAll('[data-credits2]').forEach(el => el.textContent = `${A.S.credits} / 500`);
  root.querySelectorAll('[data-meter]').forEach(el => el.style.transform = `scaleX(${A.S.credits / 500})`);
  root.querySelectorAll('[data-title]').forEach(el => el.textContent = A.S.title);
  root.querySelectorAll('.send').forEach(el => { el.innerHTML = A.S.busy && !A.S.waiting ? ic('stop') : ic('arrowUp'); el.setAttribute('aria-label', A.S.busy && !A.S.waiting ? 'Stop' : 'Send'); });
}
function stickToBottom(sc, wasNear) { if (wasNear) sc.scrollTop = sc.scrollHeight; }

// ======================= 1. THREAD (Linear Ask) =======================

// ======================= 3. AUTOPILOT (Cursor setup checklist) =======================
function Autopilot() {
  const el = document.createElement('div');
  el.innerHTML = `<div class="shell"><main class="main"><div class="mainbar"><span class="logo" aria-hidden="true">P</span><span class="title">Puterminator</span><span style="color:var(--fg-4)">/</span><span style="color:var(--fg-3)">${ROOT}</span><span class="grow"></span></div>
    <div class="scroll"><div data-body></div></div><div class="composer-wrap" data-cw hidden>${composerHtml('Steer the run…', false)}</div></main></div>`;
  let A;
  const body = el.querySelector('[data-body]'), sc = el.querySelector('.scroll'), cw = el.querySelector('[data-cw]');
  const goals = [['sparkle', 'Organize everything', 'Rename, restructure, clean'], ['chart', 'Audit my library', 'Score only, change nothing'], ['trash', 'Clean junk only', 'No renames'], ['clock', 'What did I never open?', 'Free up space']];
  const render = () => {
    const near = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 160;
    if (!A.S.turns.length) {
      cw.hidden = true;
      body.innerHTML = `<div class="run"><div class="run-head"><h2>Start a run on ${ROOT}</h2><span style="color:var(--fg-3)">Pick a goal. I work through it and stop only when I need you.</span><div class="memory" style="justify-content:flex-start;margin-top:6px">${ic('history')}<span>Last time, Oct 29: organized 2,112 files in ${ROOT}. Checkpoint #1 is still there if you want it back.</span></div></div>
        <div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr))">${goals.map(([i, t, d]) => `<button class="card-s" data-say="${t}">${ic(i)}<span class="t">${t}</span><span class="d">${d}</span></button>`).join('')}</div></div>`;
    } else {
      cw.hidden = false;
      // Flatten the whole conversation into a checklist: tool steps, questions, approvals, apply.
      const items = []; let notes = [];
      A.S.turns.forEach((t, ti) => { if (t.role === 'user') { if (ti > 0) items.push({ kind: 'user', text: t.text }); return; }
        t.parts.forEach((p, pi) => {
          const id = `${ti}.${pi}`;
          if (p.type === 'text') notes.push(p);
          else if (p.type === 'step' || p.type === 'think') { if (p.type === 'think') return; items.push({ kind: 'step', p, id, notes }); notes = []; }
          else if (p.type === 'question') { items.push({ kind: 'q', p, id, notes }); notes = []; }
          else if (['score', 'plan', 'progress', 'done', 'unopened', 'suggest'].includes(p.type)) { const last = items[items.length - 1]; if (last) (last.extra ||= []).push({ p, id }); }
        }); });

      body.innerHTML = `<div class="run"><div class="run-head"><h2>${esc(first)}</h2><span style="color:var(--fg-3)">${A.S.busy ? 'Running' : A.S.waiting ? 'Waiting for you' : 'Idle'} · Sonnet 5.5 · ${ROOT}</span></div><div class="checklist">
        ${items.map((it, k) => {
          if (it.kind === 'user') return `<div class="ck"><span class="ck-ic" aria-hidden="true" style="color:var(--fg-3)">${ic('chev')}</span><div style="color:var(--fg-2)">You: ${esc(it.text)}</div></div>`;
          const p = it.p, running = p.status === 'running' || (it.kind === 'q' && !p.answer), need = it.kind === 'q' && !p.answer;
          const icon = need ? '<span class="ck-ic need" aria-label="Needs you">!</span>' : running ? '<span class="ck-ic"><span class="spin"></span></span>' : `<span class="ck-ic done" aria-label="Done">${ic('check')}</span>`;
          const title = it.kind === 'q' ? esc(p.q) : esc(p.label);
          const detail = it.kind === 'q' ? (p.answer ? esc(p.options.find(o => o.id === p.answer)?.label || '') : '') : esc(p.detail || '');
          const notesHtml = it.notes?.length ? it.notes.map(n => `<p style="margin:0;color:var(--fg-2);max-width:62ch">${md(n.text.slice(0, n.shown))}</p>`).join('') : '';
          const extra = (it.extra || []).map(x => partHtml(x.p, A, x.id, 'thread')).join('');
          return `<div class="ck ${need || running ? 'active' : ''}">${icon}<div style="min-width:0"><div class="ck-t">${title}${need ? '<span class="tag tag-warn">Needs you</span>' : ''}</div>${detail ? `<div class="ck-d num">${detail}</div>` : ''}
            ${(notesHtml || (need ? questionHtml(p, A) : '') || extra) ? `<div class="ck-body">${notesHtml}${need ? questionHtml(p, A) : ''}${extra}</div>` : ''}</div></div>`;
        }).join('')}
        ${lastNotes.length ? `<div class="ck"><span class="ck-ic" aria-hidden="true"></span><div class="ck-body" style="margin:0">${lastNotes.map(n => `<p style="margin:0;color:var(--fg-2);max-width:62ch">${md(n.text.slice(0, n.shown))}</p>`).join('')}</div></div>` : ''}

}

const variants = [Thread, Workspace, Autopilot];

// ---------- picker wiring — PICKER.md reference, re-mount renders a fresh variant ----------
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;
function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + 'px'; highlight.style.transform = `translateX(${el.offsetLeft}px)`; }
function mount(i) { stage.innerHTML = ''; expanded.clear(); seen.clear(); requestAnimationFrame(() => { stage.appendChild(variants[i]()); }); }
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => { el.toggleAttribute('data-active', j === i); if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current'); });
  moveHighlight();
  const url = new URL(location); url.searchParams.set('v', i + 1); history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>

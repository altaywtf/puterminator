name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Boot the Worker on fakes
        run: |
          PORTLESS=0 pnpm dev:fake > dev-fake.log 2>&1 &
          deadline=$(($(date +%s) + 120))
          until curl -sf --max-time 5 http://localhost:1337/api/me | grep -q '"configured":true'; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              cat dev-fake.log
              echo "pnpm dev:fake did not serve /api/me within 2m"
              exit 1
            fi
            sleep 2
          done

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: production
      url: https://puterminator.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Read this month's console spend
        env:
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: node scripts/console-spend.ts | tee -a "$GITHUB_ENV"
      - name: Deploy
        env:
          DO_NOT_TRACK: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUTIO_CLIENT_ID: ${{ secrets.PUTIO_CLIENT_ID }}
          PUTIO_CLIENT_SECRET: ${{ secrets.PUTIO_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          OPENSUBTITLES_USERNAME: ${{ secrets.OPENSUBTITLES_USERNAME }}
          OPENSUBTITLES_PASSWORD: ${{ secrets.OPENSUBTITLES_PASSWORD }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          UNLIMITED_USERS: ${{ vars.UNLIMITED_USERS }}
        run: pnpm exec alchemy deploy --stage prod --yes
      - name: Smoke the live site
        run: |
          want="$(grep -o '/assets/index-[^"]*\.js' dist/index.html)"
          deadline=$(($(date +%s) + 180))
          until curl -sf --max-time 10 https://puterminator.com/ | grep -qF "$want"; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "puterminator.com did not serve $want within 3m"
              exit 1
            fi
            sleep 10
          done
          curl -sf --max-time 10 "https://puterminator.com$want" -o /dev/null
          curl -sf --max-time 10 https://puterminator.com/api/me | grep -q '"configured":true'
